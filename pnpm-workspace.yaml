packages:
  - packages/*
  - fixtures/*

catalogMode: prefer

catalog:
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
  protoshot: workspace:*
  "@cloudflare/vite-plugin": ^1.63.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
